# scripts/check.conf — TalepYönetim (backend/ .NET 10 · frontend/ React + Vite)
# Format: <name>: <command>  — runs in order, fails fast. [fast] in the NAME = inner-loop profile.
# Commands run with sh -c from the repo root; dotnet steps cd into backend/ so backend/global.json
# (SDK pin + Microsoft.Testing.Platform runner) applies. Activated by spec 0001 (walking skeleton).
#
# --- Resource-hygiene inventory (docs/testing.md, Resource hygiene) ---
# dotnet build/test : MSBuild worker nodes, VBCSCompiler/Razor build servers -> neutralized with
#                     --disable-build-servers, -nodeReuse:false and MSBUILDDISABLENODEREUSE=1.
# dotnet test (MTP) : each test app is a process that exits with its run.
# Testcontainers    : PostgreSQL container + Ryuk reaper; the fixture disposes the container, Ryuk
#                     removes leftovers after a killed run. Every test gets a fresh database
#                     (data rule 5) — nothing reaches the next run.
# vitest            : `vitest run` (package.json "test", watch: false) — never watch mode.
# vite build / tsc / eslint / prettier / openapi-typescript : one-shot, nothing left running.
# npm               : no daemon; --no-audit --no-fund keep install quiet.
#
# Test selectors (docs/testing.md, Two speeds rule 4): backend tests split by the xUnit trait
# Category=Integration — fast runs --filter-not-trait, full-only runs --filter-trait, so every test
# runs in exactly one of them. --ignore-exit-code 8 lets a test app with no matching test pass;
# the grep refuses a run whose overall total is 0 (a selector that silently selects nothing).

requires backend-build: dotnet --list-sdks | grep -q '^10\.'
requires frontend-install: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
requires backend-integration: docker info

# resource hygiene: no MSBuild node reuse, no build servers
# locked restore: packages.lock.json must match (docs/conventions.md, versions)
backend-build [fast]: cd backend && MSBUILDDISABLENODEREUSE=1 dotnet build TalepYonetim.slnx -c Release --disable-build-servers -nodeReuse:false -p:RestoreLockedMode=true
# --no-restore: format's implicit restore is unlocked and would rewrite a stale packages.lock.json;
# the locked restore above is the only restore (review 0001 round 2 L-1)
backend-format [fast]: cd backend && MSBUILDDISABLENODEREUSE=1 dotnet format TalepYonetim.slnx --verify-no-changes --no-restore
backend-test [fast]: out=$(cd backend && MSBUILDDISABLENODEREUSE=1 dotnet test --solution TalepYonetim.slnx -c Release --no-build --filter-not-trait "Category=Integration" --ignore-exit-code 8 2>&1); rc=$?; printf '%s\n' "$out"; [ $rc -eq 0 ] && ! printf '%s\n' "$out" | grep -qE '^[[:space:]]*total: 0[[:space:]]*$'
frontend-install [fast]: npm ci --prefix frontend --no-audit --no-fund
api-contract [fast]: npm --prefix frontend run api:check
frontend-lint [fast]: npm --prefix frontend run lint
frontend-typecheck [fast]: npm --prefix frontend run typecheck
# resource hygiene: vitest run, never watch
frontend-test [fast]: npm --prefix frontend run test
frontend-build [fast]: npm --prefix frontend run build
# resource hygiene: Testcontainers fixture disposes the container; Ryuk reaps after a killed run
backend-integration: out=$(cd backend && MSBUILDDISABLENODEREUSE=1 dotnet test --solution TalepYonetim.slnx -c Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8 2>&1); rc=$?; printf '%s\n' "$out"; [ $rc -eq 0 ] && ! printf '%s\n' "$out" | grep -qE '^[[:space:]]*total: 0[[:space:]]*$'
deps-audit: out=$(cd backend && dotnet list TalepYonetim.slnx package --vulnerable --include-transitive 2>&1) || exit 1; printf '%s\n' "$out"; ! printf '%s\n' "$out" | grep -q 'has the following vulnerable packages' && npm audit --prefix frontend --audit-level=high
